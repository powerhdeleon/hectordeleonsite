<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Héctor de León | Redes sociales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="profile-page">
        <section class="profile-content" aria-labelledby="profile-title">
            <div class="intro">
                <p class="eyebrow">Sitio personal</p>
                <h1 id="profile-title">Héctor de León</h1>
                <p class="summary">Mis canales de redes sociales.</p>
            </div>

            <nav class="social-section" aria-label="Redes sociales">
                <h2>Redes sociales</h2>
                <div class="social-grid" id="socialLinks"></div>
            </nav>
        </section>

        <aside class="photo-panel" aria-label="Foto de Héctor de León">
            <div class="photo-placeholder">
                <img src="images/hector_de_leon.png" alt="Héctor de León">
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
